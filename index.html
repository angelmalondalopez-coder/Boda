<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Nos Casamos! - Ángel & Tatiana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: #f4f6f4; font-family: 'Cormorant Garamond', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.card-container { background-color: #ffffff; background-image: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), url('https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1000&auto=format&fit=crop'); background-size: cover; background-position: center; width: 100%; max-width: 550px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); padding: 40px 20px; text-align: center; border: 1px solid rgba(212, 175, 55, 0.2); }
.card-inner-border { border: 1px solid #d4af37; border-radius: 15px; padding: 35px 20px; background-color: rgba(255, 255, 255, 0.88); backdrop-filter: blur(3px); }
.intro-text { font-size: 1.25rem; color: #556b2f; font-style: italic; margin-bottom: 20px; line-height: 1.4; }
.names { font-family: 'Alex Brush', cursive; font-size: 3.6rem; color: #2c3e2e; margin-bottom: 20px; line-height: 1.1; }
.date-container { margin: 25px auto; max-width: 340px; border-top: 1.5px solid #d4af37; border-bottom: 1.5px solid #d4af37; padding: 15px 0; display: flex; flex-direction: column; align-items: center; }
.time-label { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; letter-spacing: 4px; color: #2c3e2e; margin-bottom: 10px; }
.calendar-row { display: flex; align-items: center; justify-content: center; width: 100%; gap: 15px; }
.day-name, .month-name { font-family: 'Montserrat', sans-serif; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 2px; color: #555; width: 110px; }
.day-name { text-align: right; } .month-name { text-align: left; }
.day-number { font-family: 'Cormorant Garamond', serif; font-size: 3.2rem; font-weight: 600; color: #2c3e2e; line-height: 1; border-left: 1px solid #ccc; border-right: 1px solid #ccc; padding: 0 15px; }
.countdown-title { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #7f8c8d; margin-top: 25px; margin-bottom: 12px; }
.countdown-grid { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
.countdown-item { background-color: rgba(85, 107, 47, 0.08); border: 1px solid rgba(85, 107, 47, 0.15); border-radius: 8px; padding: 10px; min-width: 65px; }
.countdown-value { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 600; color: #2c3e2e; display: block; }
.countdown-label { font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; color: #556b2f; font-style: italic; }
.location-container { margin-bottom: 30px; }
.location-title { font-size: 1.4rem; color: #2c3e2e; font-weight: 600; letter-spacing: 1px; margin-bottom: 8px; }
.location-sub { font-family: 'Montserrat', sans-serif; font-size: 0.9rem; color: #7f8c8d; letter-spacing: 1px; margin-bottom: 25px; }
.btn-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.btn { font-family: 'Montserrat', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 280px; padding: 12px 20px; border-radius: 25px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; text-decoration: none; }
.btn-maps { color: #556b2f; border: 1px solid #556b2f; }
.btn-confirm { background-color: #2c3e2e; color: #ffffff; }
.footer-esperamos { font-family: 'Alex Brush', cursive; font-size: 2.5rem; color: #556b2f; margin-top: 30px; }
</style>
</head>
<body>
<div class="card-container">
<div class="card-inner-border">
<p class="intro-text">¡Nos casamos! Y nos gustaría compartir este día tan especial contigo.</p>
<h1 class="names">Ángel y Tatiana</h1>
<div class="date-container">
<div class="time-label">19:30 H</div>
<div class="calendar-row">
<div class="day-name">Sábado</div>
<div class="day-number">12</div>
<div class="month-name">Septiembre</div>
</div>
</div>
<p class="countdown-title">Tiempo restante</p>
<div class="countdown-grid">
<div class="countdown-item"><span class="countdown-value" id="days">00</span><span class="countdown-label">días</span></div>
<div class="countdown-item"><span class="countdown-value" id="hours">00</span><span class="countdown-label">horas</span></div>
<div class="countdown-item"><span class="countdown-value" id="minutes">00</span><span class="countdown-label">min</span></div>
<div class="countdown-item"><span class="countdown-value" id="seconds">00</span><span class="countdown-label">seg</span></div>
</div>
<div class="location-container">
<p class="location-sub">La ceremonia y celebración tendrán lugar en</p>
<h2 class="location-title">SALÓN FLAMINGO</h2>
</div>
<div class="btn-group">
<a href="https://maps.google.com/?q=Salon+Flamingo" target="_blank" class="btn btn-maps"><i class="fa-solid fa-location-dot"></i> Ver Ubicación</a>
<a href="https://wa.me/34603043095?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia" target="_blank" class="btn btn-confirm"><i class="fa-brands fa-whatsapp"></i> Confirmar Asistencia</a>
</div>
<p class="footer-esperamos">¡Te esperamos!</p>
</div>
</div>
<script>
// Formato ISO estándar ("YYYY-MM-DDTHH:mm:ss") universalmente compatible con iOS y Android
const weddingDate = new Date("2026-09-12T19:30:00").getTime();

function updateCountdown() {
const now = new Date().getTime();
const distance = weddingDate - now;

if (distance < 0) {
document.getElementById("days").innerText = "00";
document.getElementById("hours").innerText = "00";
document.getElementById("minutes").innerText = "00";
document.getElementById("seconds").innerText = "00";
clearInterval(intervalId);
return;
}

const d = Math.floor(distance / (1000 * 60 * 60 * 24));
const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
const s = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById("days").innerText = String(d).padStart(2, '0');
document.getElementById("hours").innerText = String(h).padStart(2, '0');
document.getElementById("minutes").innerText = String(m).padStart(2, '0');
document.getElementById("seconds").innerText = String(s).padStart(2, '0');
}

updateCountdown();
const intervalId = setInterval(updateCountdown, 1000);
</script>
</body>
